# The fleet: the four boxes of the ring, how they are cabled and addressed, and where each keeps its
# files. This file is this project's own (two ASUS Ascent GX10, ranks 0 and 1, and two NVIDIA DGX Spark, ranks
# 2 and 3); for other boxes, copy it, change
# the values and pass the copy as FLEET=FILE to engine/server/run4.sh, ring.sh, service.sh and
# engine/comm/run4.sh. They read it, reach the workers by RANK<r>_SSH, and install it beside the
# engine on every box as fleet.conf, where the engine reads it (dsgb10_rank --fleet FILE reads another).
# README.md, "How to use", says what each key means; docs/ring.md shows the ring.
#
# Format: KEY=value lines and # comments, read the same way by the engine (engine/comm/fleet.cpp) and
# the scripts (engine/server/fleet.sh). A value has no spaces and no quotes: letters, digits and
# . _ - / ~ : , @ + % { }. In a path, a leading ~/ is the home directory of the user on the box that
# uses the path, not on rank 0, and {rank} is the rank (~/dsgb10/weights/rank{rank}.dsw).

# Every box alike: the ConnectX-7's RDMA devices, port f0 (facing rank r + 1) and port f1 (facing rank
# r - 1), on PCI domain 0 (rocep1s0f*) and PCI domain 2 (roceP2p1s0f*); their RoCE v2 GID index (the
# GID of the netdev's IPv4 address, which the engine checks against the addresses below)
NEXT_DEV0=rocep1s0f0
NEXT_DEV1=roceP2p1s0f0
PREV_DEV0=rocep1s0f1
PREV_DEV1=roceP2p1s0f1
GID_INDEX=3

# Every box alike: where run4.sh copies binaries and writes logs, and the service's directory
BIN_DIR=~/dsgb10/bin
LOG_DIR=~/dsgb10/logs
SERVICE_DIR=~/dsgb10/service
# On rank 0: the ring lock; ring.owner, ring.wants/ and ring.reclaim go beside it
RING_LOCK=/data/dsgb10/ring.lock

# Per rank r: NAME, the box's name in logs; HOSTNAME, `hostname` on it (how the engine finds its rank
# without --rank); SSH, how rank 0 reaches it (ranks 1-3); NEXT_IP<d> and PREV_IP<d>, its addresses on
# the links to ranks r + 1 and r - 1 on PCI domain d (rank r's NEXT_IP<d> and rank r + 1's PREV_IP<d>
# share a subnet); WEIGHTS, its weight file; HASHMAP, the Engram hash map; ENGRAM, the directory of its
# Engram shards engram-l1-r<r>of4.bin and engram-l14-r<r>of4.bin; ENGRAM_READ_BATCH (1 if absent), the
# Engram store's SSD reads go in multiples of this, padded with discarded reads, for an SSD that signals
# completions several at a time (8 for the Samsung PM9C1a of ranks 2 and 3; it moves no result); SPILL,
# the session store's spill directory (--disk-dir).

# Rank 0 (an ASUS Ascent GX10), where the scripts run (its weights on a USB4 SSD at /data)
RANK0_NAME=ascent-0
RANK0_HOSTNAME=gx10-9dd0
RANK0_NEXT_IP0=192.168.6.1
RANK0_NEXT_IP1=192.168.7.1
RANK0_PREV_IP0=192.168.2.1
RANK0_PREV_IP1=192.168.3.1
RANK0_WEIGHTS=/data/dsgb10/weights/rank0.dsw
RANK0_HASHMAP=/data/dsgb10/engram/engram_hashmap.bin
RANK0_ENGRAM=~/dsv41-engram-tp4
RANK0_ENGRAM_READ_BATCH=1
RANK0_SPILL=/data/dsgb10/spill

